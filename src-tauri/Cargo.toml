[package]
name = "modufile"
version = "1.0.0"
description = "Fast File Search Utility"
authors = ["Rheehose (Rhee Creative) <contact@rhee.creative>"]
edition = "2021"

[lib]
name = "modufile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
jwalk = "0.8"
once_cell = "1.19"
tokio = { version = "1", features = ["full"] }
rayon = "1.10"
opener = "0.7"
fuzzy-matcher = "0.3"
