<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모두파일 (Modufile)</title>
  <script type="module" src="/main.js" defer></script>
</head>

<body>
  <div class="container">
    <header>
      <div class="header-top">
        <h1><span class="title-text">모두파일</span></h1>
        <div class="controls">
          <select id="lang-select">
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="zh-TW">繁體中文</option>
          </select>
          <button id="theme-toggle" class="btn-icon theme-toggle" title="Toggle Theme">🌓</button>
        </div>
      </div>

      <div class="search-area">
        <input id="search-input" placeholder="검색..." autocomplete="off" />
        <label class="smart-match-toggle">
          <input type="checkbox" id="smart-match-check" />
          <span id="smart-match-label">알잘딱</span>
        </label>
      </div>
    </header>

    <div id="results-list"></div>

    <div class="status-bar">
      <div id="status-text"></div>
      <button id="refresh-btn" class="btn-refresh">인덱싱 새로고침</button>
    </div>
  </div>
</body>

</html>
